<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Widget Calendario Económico</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    .calendar-container {
      max-width: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <h2>Calendario Económico</h2>
    
    <!-- Elemento personalizado con parámetros opcionales -->
    <economic-calendar mode="2" height="600px"></economic-calendar>
  </div>

  <script>
    /**
     * API Web Component para montar el Widget del Calendario Económico
     */
    class EconomicCalendar extends HTMLElement {
      connectedCallback() {
        // Evita duplicar el script si ya fue cargado
        if (this.querySelector('script[data-type="calendar-widget"]')) return;

        // Leer atributos de configuración
        const mode = this.getAttribute('mode') || '2'; // 1: Día, 2: Semana, 3: Mes
        const height = this.getAttribute('height') || '600px';

        // Aplicar estilos al contenedor principal
        this.style.display = 'block';
        this.style.width = '100%';
        this.style.height = height;
        this.style.position = 'relative';

        // Contenedor interno donde el script inserta el iframe del calendario
        const widgetDiv = document.createElement('div');
        widgetDiv.id = 'economicCalendarWidget';
        widgetDiv.style.width = '100%';
        widgetDiv.style.height = '100%';

        // Pie de página de derechos/atribución
        const copyrightDiv = document.createElement('div');
        copyrightDiv.className = 'ecw-copyright';
        copyrightDiv.style.fontSize = '12px';
        copyrightDiv.style.marginTop = '4px';
        copyrightDiv.innerHTML = `
          <a href="https://www.metatrader.com/?utm_source=calendar.widget&utm_medium=link&utm_term=economic.calendar&utm_content=visit.mql5.calendar&utm_campaign=202.calendar.widget" 
             rel="noopener nofollow" 
             target="_blank">
            MetaTrader World Markets
          </a>
        `;

        // Inyección del script oficial de Tradays
        const script = document.createElement('script');
        script.src = 'https://www.tradays.com/c/js/widgets/calendar/widget.js?v=15';
        script.type = 'text/javascript';
        script.async = true;
        script.setAttribute('data-type', 'calendar-widget');
        script.textContent = JSON.stringify({
          width: '100%',
          height: '100%',
          mode: mode,
          fw: 'html'
        });

        // Ensamblar DOM
        this.appendChild(widgetDiv);
        this.appendChild(copyrightDiv);
        this.appendChild(script);
      }
    }

    // Registrar la etiqueta <economic-calendar> en el navegador
    customElements.define('economic-calendar', EconomicCalendar);
  </script>
</body>
</html>
