<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Macro EE.UU. - Auto-Refresh 1s & Impacto BTC</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .card { background: #151c2c; border: 1px solid #2a3447; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid #2a3447; padding-bottom: 15px; }
    h2 { margin: 0; color: #f8fafc; font-size: 20px; display: flex; align-items: center; gap: 10px; }

    /* Indicador de actualización en vivo */
    .live-status { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .pulse-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; animation: pulse 1s infinite; }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Estilos de Bloques Horarios */
    .block-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-top: 16px; }
    .block-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    
    .date-badge { background: #334155; color: #38bdf8; font-weight: bold; padding: 4px 10px; border-radius: 6px; font-size: 13px; border: 1px solid #0284c7; }
    .time-badge { background: #0284c7; color: #fff; font-weight: bold; padding: 4px 12px; border-radius: 6px; font-size: 13px; }
    
    .block-summary { background: #1e293b; border-left: 4px solid #38bdf8; padding: 12px 16px; border-radius: 0 8px 8px 0; margin-top: 12px; }
    .summary-title { font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: bold; letter-spacing: 0.5px; }
    .summary-impact { font-size: 14px; font-weight: bold; margin-top: 4px; color: #f8fafc; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #1e293b; font-size: 13px; }
    th { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
    
    .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
    .imp-high { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .imp-medium { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .imp-low { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }

    .ai-signal { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; display: inline-flex; }
    .bullish { background: #15803d; color: #dcfce7; }
    .bearish { background: #b91c1c; color: #fee2e2; }
    .neutral { background: #475569; color: #f1f5f9; }

    .update-box { display: flex; gap: 10px; align-items: center; margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px dashed #334155; flex-wrap: wrap; }

    .calendar-widget-container { width: 100%; height: 600px; position: relative; }
    #economicCalendarWidget { width: 100%; height: 100%; }
    .ecw-copyright { font-size: 11px; color: #64748b; margin-top: 6px; text-align: right; }
    .ecw-copyright a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">

  <!-- DASHBOARD DE BLOQUES CON ACTUALIZACIÓN EN VIVO -->
  <div class="card">
    <div class="dashboard-header">
      <h2>📅 Bloques Macro EE.UU. & Impacto BTC</h2>
      <div class="live-status">
        <div class="pulse-dot"></div>
        <span>AUTO-REFRESH 1s ACTIVO</span>
      </div>
    </div>

    <!-- SIMULADOR INTERACTIVO (Respaldo Manual) -->
    <div class="update-box">
      <span style="font-size: 13px; color: #94a3b8; font-weight: bold;">🧪 Registrar o Forzar Dato Reciente:</span>
      <select id="simEventSelect"></select>
      <input type="number" id="simActualValue" placeholder="Nuevo valor publicado" step="0.01" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:6px 10px; border-radius:4px; width:160px;">
      <button onclick="simulateNewsUpdate()" style="background:#0284c7; color:white; border:none; cursor:pointer;">Procesar con IA</button>
    </div>

    <div id="blocksContainer">
      <!-- Se genera y actualiza automáticamente cada segundo -->
    </div>
  </div>

  <!-- WIDGET INTEGRADO TRADAYS -->
  <div class="card">
    <h2>📅 Calendario Económico Global en Vivo (MQL5 / Tradays)</h2>
    <div class="calendar-widget-container">
      <div id="economicCalendarWidget"></div>
      <div class="ecw-copyright">
        <a href="https://www.metatrader.com/?utm_source=calendar.widget&utm_medium=link&utm_term=economic.calendar&utm_content=visit.mql5.calendar&utm_campaign=202.calendar.widget" rel="noopener nofollow" target="_blank">MetaTrader World Markets</a>
      </div>
      <script async type="text/javascript" data-type="calendar-widget" src="https://www.tradays.com/c/js/widgets/calendar/widget.js?v=15">
        {"width":"100%","height":"100%","mode":"2","fw":"html","lang":"es"}
      </script>
    </div>
  </div>

</div>

<script>
  // Reemplaza 'DEMO' por tu API Key real de Financial Modeling Prep para consumo live continuo
  const API_KEY = "DEMO";

  // Base de datos local
  let newsDatabase = [
    // 06:30 AM (Ya salieron)
    { id: 1, date: "2026-10-20", time: "06:30", event: "Inicios de construcción de Nueva Vivienda", importance: "MEDIUM", affectsBTC: true, forecast: 1.468, actual: 1.221, inverse: true },
    { id: 2, date: "2026-10-20", time: "06:30", event: "Permisos de Construcción", importance: "MEDIUM", affectsBTC: true, forecast: 1.441, actual: 1.400, inverse: true },
    { id: 3, date: "2026-10-20", time: "06:30", event: "Inicios de Construcción m/m", importance: "LOW", affectsBTC: false, forecast: -14.0, actual: -5.2, inverse: false },
    { id: 4, date: "2026-10-20", time: "06:30", event: "Permisos de Construcción m/m", importance: "LOW", affectsBTC: false, forecast: 1.2, actual: -0.2, inverse: false },

    // 08:00 AM (Bloque en actualización)
    { id: 5, date: "2026-10-20", time: "08:00", event: "Ventas de Viviendas Pendientes m/m", importance: "MEDIUM", affectsBTC: true, forecast: -0.9, actual: null, inverse: true },
    { id: 6, date: "2026-10-20", time: "08:00", event: "Ventas de Viviendas Pendientes a/a", importance: "LOW", affectsBTC: false, forecast: 0.7, actual: null, inverse: false },
    { id: 7, date: "2026-10-20", time: "08:00", event: "Índice de Ventas de Viviendas Pendientes", importance: "MEDIUM", affectsBTC: true, forecast: 70.5, actual: null, inverse: true },

    // Bloque futuro mañana
    { id: 8, date: "2026-10-21", time: "08:30", event: "Índice de Precios al Consumidor (IPC m/m)", importance: "HIGH", affectsBTC: true, forecast: 0.3, actual: null, inverse: true },
    { id: 9, date: "2026-10-21", time: "08:30", event: "IPC General a/a", importance: "HIGH", affectsBTC: true, forecast: 2.9, actual: null, inverse: true }
  ];

  function evaluateIndividual(item) {
    if (item.actual === null) return { text: "⏳ Pendiente", signal: "neutral" };
    
    let isPositive = item.inverse ? (item.actual < item.forecast) : (item.actual > item.forecast);
    if (item.actual === item.forecast) return { text: "▬ En previsión", signal: "neutral" };
    return isPositive ? { text: "▲ Alcista", signal: "bullish" } : { text: "▼ Bajista", signal: "bearish" };
  }

  function calculateBlockImpact(events) {
    let bullishCount = 0;
    let bearishCount = 0;
    let pendingCount = 0;

    events.forEach(e => {
      if (e.actual === null) {
        pendingCount++;
      } else if (e.affectsBTC) {
        const res = evaluateIndividual(e);
        if (res.signal === "bullish") bullishCount++;
        if (res.signal === "bearish") bearishCount++;
      }
    });

    if (pendingCount === events.length) {
      return {
        summary: "⏳ Bloque Pendiente de Publicación. Esperando salida de datos oficiales.",
        badge: "⏳ PENDIENTE DE DATOS",
        css: "neutral"
      };
    }

    if (pendingCount > 0) {
      return {
        summary: `🔄 Publicación Parcial (${events.length - pendingCount}/${events.length} salidos). Aguardando el resto de datos del bloque.`,
        badge: "🔄 EN PROCESO",
        css: "neutral"
      };
    }

    if (bullishCount > bearishCount) {
      return {
        summary: `▲ IMPACTO NETO ALCISTA PARA BITCOIN: Los datos publicados reducen la presión inflacionaria/macro. Sesgo favorable en BTC/USD.`,
        badge: "▲ ALCISTA EN BTC",
        css: "bullish"
      };
    } else if (bearishCount > bullishCount) {
      return {
        summary: `▼ IMPACTO NETO BAJISTA PARA BITCOIN: Los datos publicados muestran solidez económica o presión en tasas. Sesgo bajista en BTC/USD.`,
        badge: "▼ BAJISTA EN BTC",
        css: "bearish"
      };
    } else {
      return {
        summary: `▬ IMPACTO MIXTO / NEUTRAL: Los datos se compensan entre sí o salieron exactamente según el pronóstico.`,
        badge: "▬ NEUTRAL / MIXTO",
        css: "neutral"
      };
    }
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function renderTimeBlocks() {
    const container = document.getElementById("blocksContainer");
    const simSelect = document.getElementById("simEventSelect");
    
    // Preservar la opción seleccionada si la hay
    const selectedSimValue = simSelect.value;

    container.innerHTML = "";
    simSelect.innerHTML = "";

    // Llenar selector de simulación
    newsDatabase.filter(n => n.actual === null).forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.id;
      opt.textContent = `[${formatDate(item.date)} - ${item.time}] ${item.event}`;
      if (item.id == selectedSimValue) opt.selected = true;
      simSelect.appendChild(opt);
    });

    // Agrupar por FECHA + HORA
    const grouped = {};
    newsDatabase.forEach(item => {
      const groupKey = `${item.date}_${item.time}`;
      if (!grouped[groupKey]) grouped[groupKey] = [];
      grouped[groupKey].push(item);
    });

    Object.keys(grouped).forEach(key => {
      const events = grouped[key];
      const blockDate = events[0].date;
      const blockTime = events[0].time;
      const blockImpact = calculateBlockImpact(events);

      const blockDiv = document.createElement("div");
      blockDiv.className = "block-card";

      let rowsHtml = events.map(e => {
        const ind = evaluateIndividual(e);
        const btcTag = e.affectsBTC ? `<span style="color:#f59e0b; font-weight:bold;">⚡ BTC</span>` : `<span style="color:#64748b;">Macro</span>`;
        const impBadge = e.importance === 'HIGH' ? '<span class="badge imp-high">🔴 Alta</span>' : 
                         (e.importance === 'MEDIUM' ? '<span class="badge imp-medium">🟡 Media</span>' : '<span class="badge imp-low">🟢 Baja</span>');

        return `
          <tr>
            <td><strong>${e.event}</strong></td>
            <td>${btcTag}</td>
            <td>${impBadge}</td>
            <td>${e.forecast ?? 'N/A'}</td>
            <td><strong>${e.actual ?? 'Esperando...'}</strong></td>
            <td><span class="ai-signal ${ind.signal}">${ind.text}</span></td>
          </tr>
        `;
      }).join('');

      blockDiv.innerHTML = `
        <div class="block-header">
          <div>
            <span class="date-badge">📅 ${formatDate(blockDate)}</span>
            <span class="time-badge" style="margin-left: 6px;">⏰ Bloque de las ${blockTime}</span>
            <span style="font-size:13px; color:#94a3b8; margin-left:10px;">(${events.length} noticias en este bloque)</span>
          </div>
          <span class="ai-signal ${blockImpact.css}">${blockImpact.badge}</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>Noticia del Bloque</th>
              <th>Sensibilidad</th>
              <th>Importancia</th>
              <th>Previsión</th>
              <th>Dato Actual</th>
              <th>Sesgo Individual</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>

        <div class="block-summary" style="border-left-color: ${blockImpact.css === 'bullish' ? '#16a34a' : (blockImpact.css === 'bearish' ? '#dc2626' : '#64748b')};">
          <div class="summary-title">Conclusión de Inteligencia Macro (${formatDate(blockDate)} — ${blockTime}):</div>
          <div class="summary-impact">${blockImpact.summary}</div>
        </div>
      `;

      container.appendChild(blockDiv);
    });
  }

  // Función de Polling que ejecuta la actualización automática cada 1s
  async function fetchLiveNews() {
    if (API_KEY !== "DEMO") {
      try {
        const response = await fetch(`https://financialmodelingprep.com/api/v3/economic_calendar?apikey=${API_KEY}`);
        const data = await response.json();
        
        // Mapear datos recibidos
        if (Array.isArray(data) && data.length > 0) {
          data.forEach(apiEvent => {
            const match = newsDatabase.find(n => n.event.toLowerCase().includes(apiEvent.event.toLowerCase()));
            if (match && apiEvent.actual !== null) {
              match.actual = parseFloat(apiEvent.actual);
            }
          });
        }
      } catch (e) {
        console.error("Error al consultar la API:", e);
      }
    }
    
    // Renderizado continuo
    renderTimeBlocks();
  }

  function simulateNewsUpdate() {
    const selectedId = parseInt(document.getElementById("simEventSelect").value);
    const newValue = parseFloat(document.getElementById("simActualValue").value);

    if (isNaN(selectedId) || isNaN(newValue)) {
      alert("Selecciona un evento e ingresa el valor publicado.");
      return;
    }

    const item = newsDatabase.find(n => n.id === selectedId);
    if (item) {
      item.actual = newValue;
      renderTimeBlocks();
      document.getElementById("simActualValue").value = "";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderTimeBlocks();
    // Ejecutar ciclo cada 1000 milisegundos (1 segundo)
    setInterval(fetchLiveNews, 1000);
  });
</script>

</body>
</html>
