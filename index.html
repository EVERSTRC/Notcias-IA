<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Macro EE.UU. - Impacto por Bloque Horario en BTC</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    .card { background: #151c2c; border: 1px solid #2a3447; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid #2a3447; padding-bottom: 15px; }
    h2 { margin: 0; color: #f8fafc; font-size: 20px; display: flex; align-items: center; gap: 10px; }

    /* Estilos de Bloques Horarios */
    .block-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 18px; margin-top: 16px; }
    .block-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
    .time-badge { background: #0284c7; color: #fff; font-weight: bold; padding: 4px 12px; border-radius: 20px; font-size: 14px; }
    
    /* Resumen de Impacto Neto del Bloque */
    .block-summary { background: #1e293b; border-left: 4px solid #38bdf8; padding: 12px 16px; border-radius: 0 8px 8px 0; margin-top: 12px; }
    .summary-title { font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: bold; letter-spacing: 0.5px; }
    .summary-impact { font-size: 14px; font-weight: bold; margin-top: 4px; color: #f8fafc; }

    /* Tablas dentro del bloque */
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #1e293b; font-size: 13px; }
    th { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
    
    .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
    .imp-high { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .imp-medium { background: rgba(217, 119, 6, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .imp-low { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }

    .ai-signal { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; display: inline-flex; }
    .bullish { background: #15803d; color: #dcfce7; }
    .bearish { background: #b91c1c; color: #fee2e2; }
    .neutral { background: #475569; color: #f1f5f9; }

    /* Widget Tradays */
    .calendar-widget-container { width: 100%; height: 600px; position: relative; }
    #economicCalendarWidget { width: 100%; height: 100%; }
    .ecw-copyright { font-size: 11px; color: #64748b; margin-top: 6px; text-align: right; }
    .ecw-copyright a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">

  <!-- DASHBOARD DE BLOQUES HORARIOS -->
  <div class="card">
    <div class="dashboard-header">
      <h2>⏰ Análisis de Impacto Neto por Bloque Horario en Bitcoin (BTC)</h2>
    </div>

    <div id="blocksContainer">
      <!-- Los bloques horarios se agruparán dinámicamente aquí -->
    </div>
  </div>

  <!-- WIDGET INTEGRADO TRADAYS -->
  <div class="card">
    <h2>📅 Calendario Económico Global en Vivo (MQL5 / Tradays)</h2>
    <div class="calendar-widget-container">
      <div id="economicCalendarWidget"></div>
      <div class="ecw-copyright">
        <a href="https://www.metatrader.com/?utm_source=calendar.widget&utm_medium=link&utm_term=economic.calendar&utm_content=visit.mql5.calendar&utm_campaign=202.calendar.widget" rel="noopener nofollow" target="_blank">MetaTrader World Markets</a>
      </div>
      <script async type="text/javascript" data-type="calendar-widget" src="https://www.tradays.com/c/js/widgets/calendar/widget.js?v=15">
        {"width":"100%","height":"100%","mode":"2","fw":"html","lang":"es"}
      </script>
    </div>
  </div>

</div>

<script>
  // Base de datos de eventos agrupados
  const newsDatabase = [
    // Bloque 06:30 AM (Ya publicado)
    { time: "06:30", event: "Inicios de construcción de Nueva Vivienda", importance: "MEDIUM", affectsBTC: true, forecast: 1.468, actual: 1.221, inverse: true },
    { time: "06:30", event: "Permisos de Construcción", importance: "MEDIUM", affectsBTC: true, forecast: 1.441, actual: 1.400, inverse: true },
    { time: "06:30", event: "Inicios de Construcción m/m", importance: "LOW", affectsBTC: false, forecast: -14.0, actual: -5.2, inverse: false },
    { time: "06:30", event: "Permisos de Construcción m/m", importance: "LOW", affectsBTC: false, forecast: 1.2, actual: -0.2, inverse: false },

    // Bloque 08:00 AM
    { time: "08:00", event: "Ventas de Viviendas Pendientes m/m", importance: "MEDIUM", affectsBTC: true, forecast: -0.9, actual: -1.2, inverse: true },
    { time: "08:00", event: "Ventas de Viviendas Pendientes a/a", importance: "LOW", affectsBTC: false, forecast: 0.7, actual: 0.5, inverse: false },
    { time: "08:00", event: "Índice de Ventas de Viviendas Pendientes", importance: "MEDIUM", affectsBTC: true, forecast: 70.5, actual: 69.8, inverse: true },

    // Bloque 08:30 AM (Ejemplo futuro)
    { time: "08:30", event: "Índice de Precios al Consumidor (IPC Subyacente m/m)", importance: "HIGH", affectsBTC: true, forecast: 0.3, actual: null, inverse: true },
    { time: "08:30", event: "IPC General a/a", importance: "HIGH", affectsBTC: true, forecast: 2.9, actual: null, inverse: true },
    { time: "08:30", event: "Nuevas Peticiones de Subsidio por Desempleo", importance: "MEDIUM", affectsBTC: true, forecast: 215, actual: null, inverse: true }
  ];

  // Evalúa el impacto individual de cada línea
  function evaluateIndividual(item) {
    if (item.actual === null) return { text: "Pendiente", signal: "neutral" };
    
    let isPositive = item.inverse ? (item.actual < item.forecast) : (item.actual > item.forecast);
    if (item.actual === item.forecast) return { text: "▬ En previsión", signal: "neutral" };
    return isPositive ? { text: "▲ Alcista", signal: "bullish" } : { text: "▼ Bajista", signal: "bearish" };
  }

  // Analiza el EFECTO NETO del bloque completo para BTC
  function calculateBlockImpact(events) {
    let bullishCount = 0;
    let bearishCount = 0;
    let pendingCount = 0;
    let highImpactCount = 0;

    events.forEach(e => {
      if (e.actual === null) {
        pendingCount++;
      } else if (e.affectsBTC) {
        const res = evaluateIndividual(e);
        if (res.signal === "bullish") bullishCount++;
        if (res.signal === "bearish") bearishCount++;
        if (e.importance === "HIGH") highImpactCount++;
      }
    });

    if (pendingCount === events.length) {
      return {
        summary: "⏳ Bloque Pendiente de Publicación. El mercado se mantendrá en rango previo al dato.",
        badge: "PENDIENTE",
        css: "neutral"
      };
    }

    if (bullishCount > bearishCount) {
      return {
        summary: `▲ IMPACTO NETO ALCISTA PARA BITCOIN: El conjunto de datos de este bloque frena la presión inflacionaria/macro. Se espera impulso alcista en BTC/USD.`,
        badge: "▲ ALCISTA EN BTC",
        css: "bullish"
      };
    } else if (bearishCount > bullishCount) {
      return {
        summary: `▼ IMPACTO NETO BAJISTA PARA BITCOIN: El resultado combinado de este bloque muestra fortaleza macro o presión en tasas. Se espera corrección a la baja en BTC/USD.`,
        badge: "▼ BAJISTA EN BTC",
        css: "bearish"
      };
    } else {
      return {
        summary: `▬ IMPACTO MIXTO / NEUTRAL: Los datos del bloque se compensan entre sí o salieron exactamente en línea con lo esperado. Movimiento lateral o volatilidad en ambas direcciones.`,
        badge: "▬ NEUTRAL / MIXTO",
        css: "neutral"
      };
    }
  }

  function renderTimeBlocks() {
    const container = document.getElementById("blocksContainer");
    container.innerHTML = "";

    // Agrupar eventos por hora exactas
    const grouped = {};
    newsDatabase.forEach(item => {
      if (!grouped[item.time]) grouped[item.time] = [];
      grouped[item.time].push(item);
    });

    // Renderizar un bloque visual por cada hora
    Object.keys(grouped).forEach(time => {
      const events = grouped[time];
      const blockImpact = calculateBlockImpact(events);

      const blockDiv = document.createElement("div");
      blockDiv.className = "block-card";

      let rowsHtml = events.map(e => {
        const ind = evaluateIndividual(e);
        const btcTag = e.affectsBTC ? `<span style="color:#f59e0b; font-weight:bold;">⚡ BTC</span>` : `<span style="color:#64748b;">Macro</span>`;
        const impBadge = e.importance === 'HIGH' ? '<span class="badge imp-high">🔴 Alta</span>' : 
                         (e.importance === 'MEDIUM' ? '<span class="badge imp-medium">🟡 Media</span>' : '<span class="badge imp-low">🟢 Baja</span>');

        return `
          <tr>
            <td><strong>${e.event}</strong></td>
            <td>${btcTag}</td>
            <td>${impBadge}</td>
            <td>${e.forecast ?? 'N/A'}</td>
            <td><strong>${e.actual ?? 'Pendiente'}</strong></td>
            <td><span class="ai-signal ${ind.signal}">${ind.text}</span></td>
          </tr>
        `;
      }).join('');

      blockDiv.innerHTML = `
        <div class="block-header">
          <div>
            <span class="time-badge">⏰ Bloque de las ${time}</span>
            <span style="font-size:13px; color:#94a3b8; margin-left:10px;">(${events.length} noticias en este bloque)</span>
          </div>
          <span class="ai-signal ${blockImpact.css}">${blockImpact.badge}</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>Noticia del Bloque</th>
              <th>Sensibilidad</th>
              <th>Importancia</th>
              <th>Previsión</th>
              <th>Dato Actual</th>
              <th>Sesgo Individual</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>

        <div class="block-summary" style="border-left-color: ${blockImpact.css === 'bullish' ? '#16a34a' : (blockImpact.css === 'bearish' ? '#dc2626' : '#64748b')};">
          <div class="summary-title">Conclusión de Inteligencia Macro para el Bloque de las ${time}:</div>
          <div class="summary-impact">${blockImpact.summary}</div>
        </div>
      `;

      container.appendChild(blockDiv);
    });
  }

  document.addEventListener("DOMContentLoaded", renderTimeBlocks);
</script>

</body>
</html>
