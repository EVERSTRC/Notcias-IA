<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Económico EE. UU. (USD) - BTC Impact</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121824;
      color: #e1e7ec;
      margin: 0;
      padding: 20px;
    }
    .dashboard-container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .header h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #38bdf8;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
    }
    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr {
      border-bottom: 1px solid #334155;
    }
    tr:hover {
      background-color: #334155;
    }
    .flag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #f59e0b;
    }
    .importance-high {
      color: #ef4444;
      font-weight: bold;
    }
    .importance-med {
      color: #f59e0b;
    }
    .importance-low {
      color: #94a3b8;
    }
    .positive { color: #22c55e; font-weight: bold; }
    .negative { color: #ef4444; font-weight: bold; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="header">
      <h1>Dashboard Económico USD (EE. UU.)</h1>
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>Hora actual: <strong id="clock">--:--:--</strong></span>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Hora</th>
          <th>Divisa</th>
          <th>Evento</th>
          <th>Impacto</th>
          <th>Actual</th>
          <th>Pronóstico</th>
          <th>Anterior</th>
        </tr>
      </thead>
      <tbody id="events-table-body">
        <tr>
          <td colspan="7" style="text-align:center; color: #94a3b8;">Cargando eventos de EE. UU...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // 1. Reloj en tiempo real
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Consulta de eventos usando Proxy CORS
    async function fetchUsdEvents() {
      const today = new Date().toISOString().split('T')[0];
      const tbody = document.getElementById('events-table-body');

      // Endpoint original de Tradays
      const targetUrl = `https://www.tradays.com/en/economic-calendar/widget/events?currency=USD&from=${today}&to=${today}`;
      
      // Proxy público para saltarse la restricción CORS
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Error de red');

        const data = await response.json();
        const events = JSON.parse(data.contents);

        if (!Array.isArray(events) || events.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: #94a3b8;">No hay eventos macroeconómicos de USD programados para hoy.</td></tr>`;
          return;
        }

        tbody.innerHTML = events.map(event => {
          const eventDate = new Date(event.date || event.date_utc);
          const time = eventDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          let impactText = 'Bajo';
          let impactClass = 'importance-low';
          if (event.importance === 3) { impactText = 'Alta (BTC)'; impactClass = 'importance-high'; }
          else if (event.importance === 2) { impactText = 'Media'; impactClass = 'importance-med'; }

          const actualVal = event.actual ?? '--';
          const forecastVal = event.forecast ?? '--';
          const previousVal = event.previous ?? '--';

          return `
            <tr>
              <td>${time}</td>
              <td><span class="flag">🇺🇸 USD</span></td>
              <td><strong>${event.name || event.title}</strong></td>
              <td class="${impactClass}">${impactText}</td>
              <td>${actualVal}</td>
              <td>${forecastVal}</td>
              <td>${previousVal}</td>
            </tr>
          `;
        }).join('');

      } catch (error) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align:center; color: #ef4444;">
              Error al actualizar los datos. Reintentando en breve...
            </td>
          </tr>
        `;
      }
    }

    // Consulta inicial y actualización periódica
    fetchUsdEvents();
    setInterval(fetchUsdEvents, 10000); // Se actualiza cada 10 segundos
  </script>
</body>
</html>
