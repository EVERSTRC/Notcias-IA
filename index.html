<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Económico EE. UU. (Hoy)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
    }
    .calendar-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Oculta las filas de noticias que NO corresponden a USD */
    #economicCalendarWidget iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <h2>Calendario Económico EE. UU. (Hoy)</h2>
    
    <economic-calendar mode="1" height="500px"></economic-calendar>
  </div>

  <script>
    class EconomicCalendar extends HTMLElement {
      connectedCallback() {
        if (this.querySelector('script[data-type="calendar-widget"]')) return;

        const mode = this.getAttribute('mode') || '1'; 
        const height = this.getAttribute('height') || '500px';

        this.style.display = 'block';
        this.style.width = '100%';
        this.style.height = height;
        this.style.position = 'relative';

        const widgetDiv = document.createElement('div');
        widgetDiv.id = 'economicCalendarWidget';
        widgetDiv.style.width = '100%';
        widgetDiv.style.height = '100%';

        const copyrightDiv = document.createElement('div');
        copyrightDiv.className = 'ecw-copyright';
        copyrightDiv.style.fontSize = '12px';
        copyrightDiv.style.marginTop = '4px';
        copyrightDiv.innerHTML = `
          <a href="https://www.metatrader.com/?utm_source=calendar.widget&utm_medium=link&utm_term=economic.calendar&utm_content=visit.mql5.calendar&utm_campaign=202.calendar.widget" 
             rel="noopener nofollow" 
             target="_blank">
            MetaTrader World Markets
          </a>
        `;

        const script = document.createElement('script');
        script.src = 'https://www.tradays.com/c/js/widgets/calendar/widget.js?v=15';
        script.type = 'text/javascript';
        script.async = true;
        script.setAttribute('data-type', 'calendar-widget');
        
        script.textContent = JSON.stringify({
          width: '100%',
          height: '100%',
          mode: mode,
          fw: 'html'
        });

        this.appendChild(widgetDiv);
        this.appendChild(copyrightDiv);
        this.appendChild(script);

        // Ajuste manual de filtros directamente desde el almacenamiento del widget
        this.configureUsdFilter();
      }

      configureUsdFilter() {
        // Guarda la preferencia de USD en el almacenamiento del navegador para la sesión
        try {
          const calendarSettings = {
            currencies: ["USD"],
            importance: [1, 2, 3]
          };
          localStorage.setItem('tradays_widget_settings', JSON.stringify(calendarSettings));
        } catch (e) {
          console.warn('No se pudo establecer el filtro en localStorage:', e);
        }
      }
    }

    customElements.define('economic-calendar', EconomicCalendar);
  </script>
</body>
</html>
